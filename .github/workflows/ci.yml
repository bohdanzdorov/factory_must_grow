name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory_ci
          POSTGRES_DB: factorymustgrow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory -d factorymustgrow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Throwaway values for the CI database above; not secrets.
    env:
      DATABASE_URL: postgresql://factory:factory_ci@localhost:5432/factorymustgrow
      # Tests create this database themselves and empty it before each test.
      TEST_DATABASE_URL: postgresql://factory:factory_ci@localhost:5432/factorymustgrow_test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is git-ignored; lint, typecheck and build need it.
      - name: Generate Prisma client
        run: npm run db:generate -w @factorymustgrow/backend

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build backend
        run: npm run build -w @factorymustgrow/backend

      - name: Apply migrations
        run: npm run db:deploy

      - name: Check schema matches migrations
        run: npm run db:check-drift -w @factorymustgrow/backend

      - name: Seed database
        run: npm run db:seed

      - name: Test
        run: npm test
